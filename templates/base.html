<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tele-Sum{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-xl font-bold text-gray-900">
                            <i class="fab fa-telegram text-blue-500 mr-2"></i>Tele-Sum
                        </h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8" id="nav-links">
                        <a href="/" class="nav-link inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" data-page="dashboard">
                            Dashboard
                        </a>
                        <a href="/categories" class="nav-link inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" data-page="categories">
                            Categories
                        </a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- Status indicator -->
                    <div id="scheduler-status" class="hidden sm:flex items-center text-sm text-gray-500">
                        <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                        <span>Auto-sync active</span>
                    </div>
                    <!-- Logout button -->
                    <a href="/logout" class="text-gray-500 hover:text-gray-700 text-sm font-medium">
                        <i class="fas fa-sign-out-alt mr-1"></i>Logout
                    </a>
                </div>
                <!-- Mobile menu button -->
                <div class="sm:hidden flex items-center">
                    <button type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" onclick="toggleMobileMenu()">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div class="sm:hidden hidden" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="/" class="mobile-nav-link block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Dashboard</a>
                <a href="/categories" class="mobile-nav-link block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Categories</a>
                <a href="/logout" class="mobile-nav-link block pl-3 pr-4 py-2 border-l-4 text-base font-medium text-red-600">Logout</a>
            </div>
        </div>
    </nav>
    
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>
    
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-Requested-With'] = 'XMLHttpRequest';
        });
        
        // Check scheduler status
        async function checkSchedulerStatus() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                const statusEl = document.getElementById('scheduler-status');
                if (statusEl && data.scheduler) {
                    statusEl.classList.remove('hidden');
                    statusEl.classList.add('flex');
                }
            } catch (e) {
                console.log('Could not check scheduler status');
            }
        }
        
        // Handle active navigation highlighting
        document.addEventListener('DOMContentLoaded', function() {
            checkSchedulerStatus();
            
            const navLinks = document.querySelectorAll('.nav-link');
            const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
            const currentPath = window.location.pathname;
            
            // Desktop navigation
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                
                // Reset all links to inactive state
                link.classList.remove('border-indigo-500', 'text-gray-900');
                link.classList.add('border-transparent', 'text-gray-500', 'hover:border-gray-300', 'hover:text-gray-700');
                
                // Check if this is the active page
                if ((currentPath === '/' && href === '/') || 
                    (currentPath !== '/' && href !== '/' && currentPath.startsWith(href))) {
                    // Set active state
                    link.classList.remove('border-transparent', 'text-gray-500', 'hover:border-gray-300', 'hover:text-gray-700');
                    link.classList.add('border-indigo-500', 'text-gray-900');
                }
            });
            
            // Mobile navigation
            mobileNavLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === '/logout') return; // Skip logout link
                
                // Reset all links to inactive state
                link.classList.remove('border-indigo-500', 'text-indigo-700', 'bg-indigo-50');
                link.classList.add('border-transparent', 'text-gray-600', 'hover:bg-gray-50', 'hover:border-gray-300', 'hover:text-gray-800');
                
                // Check if this is the active page
                if ((currentPath === '/' && href === '/') || 
                    (currentPath !== '/' && href !== '/' && currentPath.startsWith(href))) {
                    // Set active state
                    link.classList.remove('border-transparent', 'text-gray-600', 'hover:bg-gray-50', 'hover:border-gray-300', 'hover:text-gray-800');
                    link.classList.add('border-indigo-500', 'text-indigo-700', 'bg-indigo-50');
                }
            });
        });
        
        // Mobile menu toggle
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
