{% extends "base.html" %}

{% block title %}Categories - Tele-Sum{% endblock %}

{% block content %}
<div class="px-4 sm:px-0">
    <div class="bg-white shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-medium text-gray-900">Manage Categories</h2>
                <button onclick="openAddCategoryModal()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <i class="fas fa-plus mr-2"></i>Add Category
                </button>
            </div>
            
            <div id="categories-list" class="space-y-4">
                <div class="text-center py-12">
                    <i class="fas fa-spinner fa-spin text-4xl text-gray-400"></i>
                    <p class="mt-2 text-sm text-gray-500">Loading categories...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Category Modal -->
<div id="categoryModal" class="hidden fixed z-10 inset-0 overflow-y-auto">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="closeCategoryModal()"></div>
        
        <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
            <form id="categoryForm" onsubmit="saveCategorySubmit(event)">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4" id="modalTitle">Add Category</h3>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="categoryName" class="block text-sm font-medium text-gray-700">Name</label>
                            <input type="text" id="categoryName" name="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        </div>
                        
                        <div>
                            <label for="categoryDescription" class="block text-sm font-medium text-gray-700">Description</label>
                            <textarea id="categoryDescription" name="description" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                        </div>
                        
                        <div>
                            <label for="categoryKeywords" class="block text-sm font-medium text-gray-700">Keywords (comma-separated)</label>
                            <textarea id="categoryKeywords" name="keywords" rows="2" placeholder="Enter keywords separated by commas" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                        </div>
                    </div>
                </div>
                
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="submit" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-indigo-600 text-base font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Save
                    </button>
                    <button type="button" onclick="closeCategoryModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentEditId = null;
    
    // Load categories
    function loadCategories() {
        fetch('/api/categories')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('categories-list');
                
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12">
                            <i class="fas fa-folder-open text-4xl text-gray-400"></i>
                            <p class="mt-2 text-sm text-gray-500">No categories yet. Add your first category!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = data.map(cat => `
                        <div class="bg-white border rounded-lg p-4">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <h3 class="text-lg font-medium text-gray-900">${cat.name}</h3>
                                    ${cat.description ? `<p class="mt-1 text-sm text-gray-500">${cat.description}</p>` : ''}
                                    ${cat.keywords && cat.keywords.length > 0 ? `
                                        <div class="mt-2 flex flex-wrap gap-1">
                                            ${cat.keywords.map(kw => `
                                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800">
                                                    ${kw}
                                                </span>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                    <p class="mt-2 text-xs text-gray-500">
                                        ${cat.message_count || 0} messages
                                    </p>
                                </div>
                                <div class="flex space-x-2 ml-4">
                                    <button onclick="editCategory(${cat.id})" class="text-indigo-600 hover:text-indigo-900">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button onclick="deleteCategory(${cat.id})" class="text-red-600 hover:text-red-900">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            })
            .catch(error => {
                console.error('Error loading categories:', error);
                document.getElementById('categories-list').innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-exclamation-circle text-4xl text-red-400"></i>
                        <p class="mt-2 text-sm text-red-500">Failed to load categories</p>
                    </div>
                `;
            });
    }
    
    // Modal functions
    function openAddCategoryModal() {
        currentEditId = null;
        document.getElementById('modalTitle').textContent = 'Add Category';
        document.getElementById('categoryForm').reset();
        document.getElementById('categoryModal').classList.remove('hidden');
    }
    
    function editCategory(id) {
        currentEditId = id;
        fetch(`/api/categories/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('modalTitle').textContent = 'Edit Category';
                document.getElementById('categoryName').value = data.name;
                document.getElementById('categoryDescription').value = data.description || '';
                document.getElementById('categoryKeywords').value = data.keywords ? data.keywords.join(', ') : '';
                document.getElementById('categoryModal').classList.remove('hidden');
            });
    }
    
    function closeCategoryModal() {
        document.getElementById('categoryModal').classList.add('hidden');
        document.getElementById('categoryForm').reset();
        currentEditId = null;
    }
    
    function saveCategorySubmit(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        
        const data = {
            name: formData.get('name'),
            description: formData.get('description'),
            keywords: formData.get('keywords') ? formData.get('keywords').split(',').map(k => k.trim()).filter(k => k) : []
        };
        
        const url = currentEditId ? `/api/categories/${currentEditId}` : '/api/categories';
        const method = currentEditId ? 'PUT' : 'POST';
        
        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(() => {
            closeCategoryModal();
            loadCategories();
        })
        .catch(error => {
            console.error('Error saving category:', error);
            alert('Failed to save category');
        });
    }
    
    function deleteCategory(id) {
        if (confirm('Are you sure you want to delete this category?')) {
            fetch(`/api/categories/${id}`, {
                method: 'DELETE'
            })
            .then(() => loadCategories())
            .catch(error => {
                console.error('Error deleting category:', error);
                alert('Failed to delete category');
            });
        }
    }
    
    // Initial load
    loadCategories();
</script>
{% endblock %}
