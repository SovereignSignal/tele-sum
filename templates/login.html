<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tele-Sum</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white">Tele-Sum</h1>
            <p class="text-gray-400 mt-2">Enter your API key to access the dashboard</p>
        </div>
        
        {% if error %}
        <div class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded mb-6">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="mb-6">
                <label for="api_key" class="block text-gray-300 text-sm font-medium mb-2">
                    API Key
                </label>
                <input 
                    type="password" 
                    id="api_key" 
                    name="api_key" 
                    required
                    autofocus
                    class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                    placeholder="Enter your API key"
                >
            </div>
            
            <button 
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200"
            >
                Login
            </button>
        </form>
        
        <p class="text-gray-500 text-sm text-center mt-6">
            Set the API_KEY environment variable in Railway to enable authentication.
        </p>
    </div>
</body>
</html>
